:root{
  --ink:#10182C; --green:#04B477; --green-cta:#0E794E; --teal:#0D3F4A; --white:#FFFFFF;
  --orange:#FB5004; --mint:#A4E8CE; --yellow:#FBBD04; --berry:#BC0278;
  --eggshell:#EBF8F2; --sand:#FBF7F0;
  --text-primary:var(--ink); --text-secondary:#47495A;
  --bg:#FFFFFF; --bg-soft:var(--sand); --bg-soft-green:var(--eggshell);
  --hairline:rgba(16,24,44,0.10); --hairline-strong:rgba(16,24,44,0.16);
  --panel:#F9FAFB;
  --r-card:16px; --r-control:12px; --r-pill:999px;
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:20px;
  --s-6:24px; --s-8:32px; --s-10:40px; --s-12:48px; --s-16:64px;
  --font:'ES Klarheit Grotesk','DM Sans',-apple-system,sans-serif;
  --dur-instant:120ms; --dur-fast:200ms; --dur-base:300ms;
  --dur-slow:500ms; --dur-celebrate:900ms;
  --ease-out:cubic-bezier(0.22,1,0.36,1);
  --ease-in-out:cubic-bezier(0.65,0,0.35,1);
  --ease-settle:cubic-bezier(0.34,1.3,0.64,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-font-smoothing:antialiased; scrollbar-gutter:stable;}
body{
  font-family:var(--font);
  font-size:18px; line-height:1.5;
  color:var(--text-primary);
  background:var(--bg);
}
button{font-family:var(--font);}
/* every element, form control, and SVG label resolves to ES Klarheit Grotesk (DM Sans fallback) */
*{font-family:var(--font); letter-spacing:0;}
input, button, select, textarea, optgroup{font-family:var(--font);}
svg text, text{font-family:var(--font);}

/* ============ App chrome — exact vault header (fixed, content-width) ============ */
.topnav{
  position:fixed; top:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:1180px;
  display:flex; align-items:center;
  height:73px; padding:0 var(--s-8);
  background:var(--white); z-index:60;
  transition:background-color 280ms ease;
}
.topnav.navhide{ background:transparent; pointer-events:none; }
.topnav.navhide .brand, .topnav.navhide .right{ pointer-events:auto; }
.brand{display:flex; align-items:center; flex-shrink:0;}
.brand svg, .logo{display:block; height:28px; width:auto;}
nav.modes{position:relative; display:flex; gap:var(--s-6); margin-left:var(--s-16);
  transition:opacity 240ms ease, transform 320ms var(--ease-in-out);}
.topnav.navhide nav.modes{ opacity:0; transform:translateY(-10px); pointer-events:none; }
nav.modes a{
  display:flex; align-items:center; gap:var(--s-2); height:73px;
  font-size:15px; font-weight:500; color:var(--text-secondary);
  text-decoration:none; position:relative;
}
nav.modes a .ic, .side li .ic{width:20px; height:20px; opacity:0.85;}
nav.modes a.active{color:var(--ink); font-weight:600;}
nav.modes a.active .ic, .side li.active .ic{opacity:1;}
.nav-ind{position:absolute; bottom:16px; left:0; height:2px; width:0; background:var(--green); border-radius:2px; opacity:0;
  transition:transform .34s cubic-bezier(0.22,1,0.36,1), width .34s cubic-bezier(0.22,1,0.36,1), opacity .2s ease;}
.nav-ind.ready{opacity:1;}
.topnav .brand{ cursor:pointer; }
@media (prefers-reduced-motion:reduce){ .nav-ind{ transition:none; } }
.topnav .right{margin-left:auto; display:flex; align-items:center; gap:var(--s-3);}
.iconbtn{width:42px; height:42px; border-radius:var(--r-pill); border:1px solid var(--hairline); background:var(--white); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink);}
.avatar-s{width:42px; height:42px; border-radius:var(--r-pill); background:var(--white); color:var(--ink); border:1px solid var(--hairline); display:flex; align-items:center; justify-content:center; font-weight:600; font-size:15px;}
/* hover tooltips for the top-right nav controls */
.topnav .right [data-tip]{ position:relative; }
.topnav .right [data-tip]::after{
  content:attr(data-tip); position:absolute; top:calc(100% + 8px); left:50%; transform:translateX(-50%) translateY(4px);
  background:#10182C; color:#FFFFFF; font-size:12px; font-weight:500; line-height:1; white-space:nowrap;
  padding:6px 9px; border-radius:7px; pointer-events:none; opacity:0; z-index:120;
  transition:opacity .16s ease, transform .16s ease; }
.topnav .right [data-tip]::before{
  content:''; position:absolute; top:calc(100% + 3px); left:50%; transform:translateX(-50%) translateY(4px);
  border:5px solid transparent; border-bottom-color:#10182C; pointer-events:none; opacity:0; z-index:120;
  transition:opacity .16s ease, transform .16s ease; }
.topnav .right [data-tip]:hover::after, .topnav .right [data-tip]:focus-visible::after,
.topnav .right [data-tip]:hover::before, .topnav .right [data-tip]:focus-visible::before{
  opacity:1; transform:translateX(-50%) translateY(0); }
@media (prefers-reduced-motion: reduce){ .topnav .right [data-tip]::after, .topnav .right [data-tip]::before{ transition:none; } }

.layout{
  display:grid;
  grid-template-columns:200px minmax(0,620px) 1fr;
  gap:var(--s-8);
  max-width:1180px; margin:0 auto; padding:calc(73px + var(--s-6)) var(--s-8) 160px;
  align-items:start;
}
@media (max-width:1080px){ .layout{grid-template-columns:180px minmax(0,1fr); } .rail{display:none;} .side{width:180px;} }
@media (max-width:760px){ .layout{grid-template-columns:1fr;} .side{display:none;} .center{grid-column:auto;} }

/* left sidebar */
.side{position:fixed; top:96px; width:200px; left:max(32px, 50% - 558px);}
.side h1{font-size:23px; font-weight:600; line-height:38px; letter-spacing:0; color:var(--ink); margin-bottom:var(--s-5);}
.side h1{cursor:pointer;}
/* plan selector */
.plan-select{display:flex; flex-direction:column; gap:2px; margin-bottom:var(--s-5);}
.plan-row{display:flex; align-items:center; gap:10px; min-height:36px; padding:5px 8px 5px 2px;
  background:none; border:none; font:inherit; text-align:left; cursor:pointer;
  color:var(--text-secondary); border-radius:10px;}
.plan-row:hover{background:#F6F7F8;}
.plan-box{flex:0 0 auto; width:16px; height:16px; border-radius:5px;
  border:2px solid var(--hairline-strong); display:grid; place-items:center;
  transition:border-color var(--dur-fast);}
.plan-box > span{width:0; height:0; border-radius:2px; background:var(--green-cta);
  transition:width var(--dur-fast), height var(--dur-fast);}
.plan-row[aria-checked="true"] .plan-box{border-color:var(--green-cta);}
.plan-row[aria-checked="true"] .plan-box > span{width:8px; height:8px;}

function li(x, grp, hidden){
  var key=x[0], label=x[1], dot=x[2], alert=x[3], locked=x[4];
  var cls=['nav-indent']; if(hidden) cls.push('nav-extra'); if(locked) cls.push('locked');
  var d = dot===undefined ? '' : '<span class="nav-dot'+(dot?' done':'')+'" aria-hidden="true"></span>';
  var lab = alert ? '<span class="onav-lbl">'+label+'<span class="onav-alert" aria-label="'+alert+' action needed">'+alert+'</span></span>' : label;
  return '<li class="'+cls.join(' ')+'"'+(grp?' data-grp="'+grp+'"':'')+' data-key="'+key+'">'+d+lab+(locked?' '+LK:'')+'</li>';
}
function render(){
  var h='<ul>';
  TOP.forEach(function(s){
    h+='<li data-top="'+s.id+'">'+(ICONS[s.id]||'')+(s.badge?'<span class="onav-lbl">'+s.t+'<span class="onav-alert" aria-label="'+s.badge+' suggestions">'+s.badge+'</span></span>':s.t)+'</li>';
    var inner='';
    if(s.items && s.items.length) inner+='<ul>'+s.items.map(function(x){return li(x);}).join('')+'</ul>';
    if(s.groups) s.groups.forEach(function(g){
      inner+='<div class="group-label nav-indent"><span class="grp-t">'+g.t+'</span>'+CHEV.replace('GRP',g.g)+'</div>';
      inner+='<ul data-grp="'+g.g+'">'+g.items.map(function(x,i){return li(x,g.g,g.show&&i>=g.show);}).join('')+'</ul>';
      if(g.show) inner+='<button type="button" class="nav-more" data-grp="'+g.g+'" data-more="'+g.g+'">'+(g.items.length-g.show)+' more</button>';
    });
    if(s.tail) inner+='<a class="side-download nav-indent" role="button" tabindex="0">'+s.tail+' '+DL+'</a>';
    if(inner) h+='<li data-sub="'+s.id+'" style="display:none;padding:0 0 var(--s-3);cursor:default;background:none">'+inner+'</li>';
  });
  h+='</ul>';
  $('#sideNav').innerHTML='<div class="su-selectwrap plan-select"><select class="su-select" aria-label="Active scenario" id="scenarioSel"><option>Retire at 65</option><option>Retire at 62</option><option>Retire at 67</option><option>Plan B: downsize</option></select></div>'+h;
  }
function stub(title, path){ $('#stubHead').innerHTML='<div class="alo-top"><h2 class="snap-headline"><em class="yrs">'+title+'</em></h2><p class="bud-sub">'+path+'</p></div>'; }
var MAP={overview:'home', myplan:'plan', explorers:'optimize'};
function head(id){ var k=MAP[id]; if(k) $('#stubHead').innerHTML=HEADS[k]; else stub(labelOf($('#sideNav li[data-top="'+id+'"]')), labelOf($('#sideNav li[data-top="'+id+'"]'))); }
function labelOf(el){ return el.textContent.replace(/\s+/g,' ').trim().replace(/\s*1$/,''); }

var nav=$('#sideNav');
nav.addEventListener('click',function(e){
  var top=e.target.closest('li[data-top]');
  if(top){
    var id=top.dataset.top, sub=$('#sideNav li[data-sub="'+id+'"]');
    var wasOpen = sub && sub.style.display!=='none';
    $$('#sideNav li[data-sub]').forEach(function(l){ l.style.display='none'; });
    $$('#sideNav li.active').forEach(function(l){ l.classList.remove('active'); });
    top.classList.add('active');
    if(sub && !wasOpen) sub.style.display='block';
    head(id);
    return;
  }
  var chev=e.target.closest('.grp-chev');
  if(chev){ var g=chev.dataset.grpChev; nav.classList.toggle(g+'-shut'); chev.setAttribute('aria-expanded', nav.classList.contains(g+'-shut')?'false':'true'); return; }
  var mb=e.target.closest('.nav-more');
  if(mb){
    var g2=mb.dataset.more;
    var open = $$('#sideNav [data-grp="'+g2+'"].nav-extra')[0].style.display==='flex';
    $$('#sideNav [data-grp="'+g2+'"].nav-extra').forEach(function(x){ x.style.display = open ? '' : 'flex'; });
    if(!open){ mb.dataset.n=mb.textContent; mb.textContent='Fewer'; } else mb.textContent=mb.dataset.n;
    return;
  }
  var item=e.target.closest('li.nav-indent');
  if(item){
    var subEl=item.closest('li[data-sub]'); var topEl=$('#sideNav li[data-top="'+subEl.dataset.sub+'"]');
    $$('#sideNav li.active').forEach(function(l){ if(l!==topEl) l.classList.remove('active'); });
    item.classList.add('active');
    var gl=item.closest('ul').previousElementSibling; var grp='';
    if(gl && gl.classList.contains('group-label')) grp=gl.querySelector('.grp-t').textContent+' › ';
    stub(labelOf(item), labelOf(topEl)+' › '+grp+labelOf(item));
    return;
  }
  var dl=e.target.closest('.side-download');
  if(dl){ var se=dl.closest('li[data-sub]'); stub(dl.textContent.trim(), labelOf($('#sideNav li[data-top="'+se.dataset.sub+'"]'))+' › '+dl.textContent.trim()); }
});
/* hide nav-extra items by default (the plan-page clip) */
nav.addEventListener('click',function(){});
$('#resetNav').addEventListener('click',function(){ var v=$('#scenarioSel')&&$('#scenarioSel').value; render(); if(v) $('#scenarioSel').value=v; clipExtras(); $('#sideNav li[data-top="overview"]').classList.add('active'); head('overview'); });
function clipExtras(){ $$('#sideNav .nav-extra').forEach(function(x){ x.style.display='none'; }); }
render(); clipExtras(); head('overview');
$('#sideNav li[data-top="overview"]').classList.add('active');
$('.topnav .brand').addEventListener('click',function(){ $('#sideNav li[data-top="overview"]').click(); });
})();
